<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Find relevant jobs, understand your skill gaps, and plan your next career move with Vortex." />
    <meta name="theme-color" content="#f5f1e9" />
    <title>Vortex — Your next chapter</title>
    <script>
      try {
        const theme = localStorage.getItem('theme');
        document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#171716' : '#f5f1e9';
      } catch (_) {}
    </script>
    <style>
      html { background: #f5f1e9; color: #24231f; }
      html[data-theme='dark'] { background: #171716; color: #f1f0eb; }
      body { background: inherit; color: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
